name: CI Custom

on:
  #push:
    #branches: [ "main" ]
  #pull_request:
    #branches: [ "main" ]

  workflow_dispatch:

env:
  solution_folder: 'solutions/'
  solution_name: 'GHActions'

jobs:

  pack_solution:

    name: Pack solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

  build_app:

    name: Build app
    needs: pack_solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
