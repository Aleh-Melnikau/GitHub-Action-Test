name: CI Custom

on:
  #push:
    #branches: [ "main" ]
  #pull_request:
    #branches: [ "main" ]

  workflow_dispatch:

env:
  solution_folder: 'solutions/'
  solution_name: 'GHActions'

jobs:

  pack_solution:

    name: Pack solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      - name: Pack solution
        uses: microsoft/powerplatform-actions/pack-solution@v1.9.2
        with:
          solution-folder: ${{ env.solution_folder }}${{ env.solution_name }}
          solution-file: ${{ env.solution_folder }}${{ env.solution_name }}_managed.zip
          solution-type: Managed

  build_app:

    name: Build app
    needs: pack_solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
