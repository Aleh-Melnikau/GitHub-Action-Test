name: CI
# Export solution from DEV environment
#  unpack it and prepare, commit and push a git branch with the changes

on:
  workflow_dispatch:
    inputs:
      # Change this value
      solution_name:
        description: 'Name of the solution to worked on from Power Platform'
        required: true
        default: GHActions

env:
#edit your values here
  solution_exported_folder: 'out/exported/'
  solution_folder: 'out/solutions/'
  solution_target_folder: 'solutions/'

permissions:
  contents: write

jobs:
  export-from-dev:
    environment: Dev
    runs-on: ubuntu-latest
    # or you can say runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1.9.2

    - name: who-am-i action
      uses: microsoft/powerplatform-actions/who-am-i@v1.9.2
      with:
        environment-url: ${{vars.REPO_ENV_PP_URL}}
        app-id: ${{secrets.REPO_ENV_PP_APPID}}
        client-secret: ${{ secrets.REPO_ENV_PP_CLIENTSECRET }}
        tenant-id: ${{secrets.REPO_ENV_PP_TENANTID}}

    - name: export-solution action
      uses: microsoft/powerplatform-actions/export-solution@v1.9.2
      with:
        environment-url: ${{vars.REPO_ENV_PP_URL}}
        app-id: ${{secrets.REPO_ENV_PP_APPID}}
        client-secret: ${{ secrets.REPO_ENV_PP_CLIENTSECRET }}
        tenant-id: ${{secrets.REPO_ENV_PP_TENANTID}}
        solution-name: ${{ github.event.inputs.solution_name }}
        solution-output-file: ${{env.solution_exported_folder}}/${{ github.event.inputs.solution_name }}.zip
        managed: true

    - name: unpack-solution action
      uses: microsoft/powerplatform-actions/unpack-solution@v1.9.2
      with:
        solution-file: ${{env.solution_exported_folder}}/${{ github.event.inputs.solution_name }}.zip
        solution-folder: ${{env.solution_folder}}/${{ github.event.inputs.solution_name }}
        solution-type: 'Managed'
        overwrite-files: true

    - name: branch-solution, prepare it for a PullRequest
      uses: microsoft/powerplatform-actions/branch-solution@v1.9.2
      with:
        solution-folder: ${{env.solution_folder}}/${{ github.event.inputs.solution_name }}
        solution-target-folder: ${{env.solution_target_folder}}/${{ github.event.inputs.solution_name }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        allow-empty-commit: true
